name: CI

on:
  schedule:
    - cron: "17 17 * * 1"
  workflow_dispatch:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel-version:
          - "7.*"
          - "8.*"
          - "9.*"
          - "rolling"
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel-version }}
    steps:
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: 1
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.bazel-version }}
          repository-cache: true
      - uses: actions/checkout@v6
      - run: |
          bazel test ...
          bazel test ... --incompatible_no_implicit_file_export
      - working-directory: e2e/smoke
        run: |
          bazel test ...
          bazel test --test_output errors binary-with-unused-compile-time-dep-unused-deps-test | grep 'remove deps'
          bazel test --test_output errors library-with-two-unused-compile-time-deps-unused-deps-test | grep 'remove deps'
          bazel test --test_output errors library-with-unused-compile-time-dep-unused-deps-test | grep 'remove deps'
  release:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          bazel build :unused-deps_deploy.jar
          bin="$(bazel cquery --output files :unused-deps_deploy.jar)"
          export bin_sri="$(openssl dgst -sha256 -binary < ${bin} | openssl base64 -A)"
          export bin_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${bin##/}"
          
          src="rules_unused_deps.tar.gz"
          git archive --format=tar.gz --prefix=rules_unused_deps/ ${GITHUB_REF_NAME} > ${src}
          export src_sri="$(openssl dgst -sha256 -binary < ${src} | openssl base64 -A)"
          export src_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${src##/}"
          
          export ver="${GITHUB_REF_NAME#v}"
          gh release create ${GITHUB_REF_NAME} -F <(envsubst < NOTES.md) ${bin} ${src}
